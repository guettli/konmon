check: conditions
cases:
  - name: healthy deployment
    resource: deployments.apps
    object:
      metadata: {name: web, namespace: default}
      status:
        conditions:
          - {type: Available, status: "True", reason: MinimumReplicasAvailable}
          - {type: Progressing, status: "True", reason: NewReplicaSetAvailable}
    expect: []

  - name: unavailable deployment with replica detail
    resource: deployments.apps
    now: 2026-01-01T00:10:00Z
    object:
      metadata: {name: web, namespace: default}
      spec: {replicas: 3}
      status:
        availableReplicas: 1
        conditions:
          - type: Available
            status: "False"
            reason: MinimumReplicasUnavailable
            message: Deployment does not have minimum availability.
            lastTransitionTime: "2026-01-01T00:00:00Z"
    expect:
      - key: Available
        condition: Available
        message: 'Condition Available=False MinimumReplicasUnavailable "Deployment does not have minimum availability." available 1/3'
        since: "2026-01-01T00:00:00Z"
        details: {status: "False", reason: MinimumReplicasUnavailable, message: Deployment does not have minimum availability.}

  - name: negative polarity node conditions
    resource: nodes
    object:
      metadata: {name: n1}
      status:
        conditions:
          - {type: MemoryPressure, status: "False"}
          - {type: KernelDeadlock, status: "False"}
          - {type: Ready, status: "True"}
          - {type: DiskPressure, status: "True", reason: KubeletHasDiskPressure}
    expect:
      - {condition: DiskPressure, message: 'Condition DiskPressure=True KubeletHasDiskPressure ""'}

  - name: unknown condition type is reported when not True
    resource: widgets.example.com
    object:
      metadata: {name: w, namespace: x}
      status:
        conditions:
          - {type: Frobnicated, status: "False", reason: Nope}
    expect:
      - {condition: Frobnicated}

  - name: merged conditions with the same reason and message
    resource: jobs.batch
    object:
      metadata: {name: j, namespace: default}
      status:
        conditions:
          - {type: FailureTarget, status: "True", reason: BackoffLimitExceeded, message: Job has reached the specified backoff limit, lastTransitionTime: "2025-12-31T23:00:00Z"}
          - {type: Failed, status: "True", reason: BackoffLimitExceeded, message: Job has reached the specified backoff limit, lastTransitionTime: "2025-12-31T23:30:00Z"}
    expect:
      - key: Failed/FailureTarget
        condition: Failed/FailureTarget
        since: "2025-12-31T23:00:00Z"

  - name: failed CronJob run is history once a newer run succeeded
    resource: jobs.batch
    object:
      metadata: {name: guard-1, namespace: monitoring, uid: j1, creationTimestamp: "2026-01-01T00:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
      status: {conditions: [{type: Failed, status: "True", reason: BackoffLimitExceeded, message: Job has reached the specified backoff limit}]}
    related:
      - resource: jobs.batch
        object:
          metadata: {name: guard-2, namespace: monitoring, uid: j2, creationTimestamp: "2026-01-01T01:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
          status: {conditions: [{type: SuccessCriteriaMet, status: "True"}, {type: Complete, status: "True"}]}
    expect: []

  - name: failed CronJob run stays while no newer run succeeded
    resource: jobs.batch
    object:
      metadata: {name: guard-2, namespace: monitoring, uid: j2, creationTimestamp: "2026-01-01T01:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
      status: {conditions: [{type: Failed, status: "True", reason: BackoffLimitExceeded, message: Job has reached the specified backoff limit}]}
    related:
      - resource: jobs.batch
        object:
          metadata: {name: guard-1, namespace: monitoring, uid: j1, creationTimestamp: "2026-01-01T00:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
          status: {conditions: [{type: SuccessCriteriaMet, status: "True"}, {type: Complete, status: "True"}]}
      - resource: jobs.batch
        object:
          metadata: {name: guard-3, namespace: monitoring, uid: j3, creationTimestamp: "2026-01-01T02:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
          status: {active: 1}
    expect:
      - {condition: Failed}

  - name: Pod of a superseded CronJob run is history too
    resource: pods
    object:
      metadata: {name: guard-1-abc, namespace: monitoring, ownerReferences: [{uid: j1, kind: Job, name: guard-1, apiVersion: batch/v1, controller: true}]}
      status:
        phase: Failed
        conditions:
          - {type: ContainersReady, status: "False", reason: PodFailed}
    related:
      - resource: jobs.batch
        object:
          metadata: {name: guard-1, namespace: monitoring, uid: j1, creationTimestamp: "2026-01-01T00:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
          status: {conditions: [{type: Failed, status: "True", reason: BackoffLimitExceeded, message: Job has reached the specified backoff limit}]}
      - resource: jobs.batch
        object:
          metadata: {name: guard-2, namespace: monitoring, uid: j2, creationTimestamp: "2026-01-01T01:00:00Z", ownerReferences: [{uid: cj1, kind: CronJob, name: guard, apiVersion: batch/v1, controller: true}]}
          status: {conditions: [{type: SuccessCriteriaMet, status: "True"}, {type: Complete, status: "True"}]}
    expect: []

  - name: failed Job without a CronJob is always reported
    resource: jobs.batch
    object:
      metadata: {name: migrate, namespace: default, uid: j9, creationTimestamp: "2026-01-01T00:00:00Z"}
      status: {conditions: [{type: Failed, status: "True", reason: BackoffLimitExceeded, message: Job has reached the specified backoff limit}]}
    related:
      - resource: jobs.batch
        object:
          metadata: {name: migrate-2, namespace: default, uid: j10, creationTimestamp: "2026-01-01T01:00:00Z"}
          status: {conditions: [{type: SuccessCriteriaMet, status: "True"}, {type: Complete, status: "True"}]}
    expect:
      - {condition: Failed}

  - name: Ready summary is dropped when another condition says the same
    resource: machines.cluster.x-k8s.io
    object:
      metadata: {name: m, namespace: default}
      status:
        conditions:
          - {type: Ready, status: "False", reason: WaitingForInfrastructure, message: "0 of 2 completed"}
          - {type: InfrastructureReady, status: "False", reason: WaitingForInfrastructure, message: "0 of 2 completed"}
    expect:
      - {condition: InfrastructureReady}

  - name: starting pod within grace period
    resource: pods
    now: 2026-01-01T00:00:10Z
    object:
      metadata: {name: p, namespace: default}
      status:
        containerStatuses: [{name: app, restartCount: 0}]
        conditions:
          - {type: ContainersReady, status: "False", reason: ContainersNotReady, lastTransitionTime: "2026-01-01T00:00:00Z"}
          - {type: Initialized, status: "True"}
    expect: []

  - name: starting pod within grace period, with Ready as the kubelet writes it
    resource: pods
    now: 2026-01-01T00:00:10Z
    object:
      metadata: {name: p, namespace: default}
      status:
        containerStatuses: [{name: app, restartCount: 0}]
        conditions:
          - {type: Initialized, status: "True"}
          - {type: Ready, status: "False", reason: ContainersNotReady, message: "containers with unready status: [app]", lastTransitionTime: "2026-01-01T00:00:00Z"}
          - {type: ContainersReady, status: "False", reason: ContainersNotReady, message: "containers with unready status: [app]", lastTransitionTime: "2026-01-01T00:00:00Z"}
          - {type: PodScheduled, status: "True"}
    expect: []

  - name: starting pod after the grace period
    resource: pods
    now: 2026-01-01T00:01:00Z
    object:
      metadata: {name: p, namespace: default}
      status:
        containerStatuses: [{name: app, restartCount: 0}]
        conditions:
          - {type: ContainersReady, status: "False", reason: ContainersNotReady, lastTransitionTime: "2026-01-01T00:00:00Z"}
    expect:
      - {condition: ContainersReady, since: "2026-01-01T00:00:00Z"}

  - name: completed pod is done
    resource: pods
    object:
      metadata: {name: p, namespace: default}
      status:
        conditions:
          - {type: Ready, status: "False", reason: PodCompleted}
          - {type: ContainersReady, status: "False", reason: PodCompleted}
          - {type: PodReadyToStartContainers, status: "False"}
    expect: []

  - name: built-in ignore regex
    resource: backuptargets.longhorn.io
    object:
      metadata: {name: default, namespace: longhorn-system}
      status:
        conditions:
          - {type: Unavailable, status: "True", reason: Unavailable, message: backup target URL is empty}
    expect: []

  - name: hetznerbaremetalhosts read spec.status
    resource: hetznerbaremetalhosts.infrastructure.cluster.x-k8s.io
    object:
      metadata: {name: h, namespace: default}
      spec:
        status:
          conditions:
            - {type: RootDeviceHintsValidated, status: "True"}
            - {type: Provisioned, status: "False", reason: Failed}
    expect:
      - {condition: Provisioned}

  - name: grace period param 0 disables it
    resource: pods
    now: 2026-01-01T00:00:10Z
    params: {podStartGraceSeconds: 0}
    object:
      metadata: {name: p, namespace: default}
      status:
        conditions:
          - {type: ContainersReady, status: "False", lastTransitionTime: "2026-01-01T00:00:00Z"}
    expect:
      - {condition: ContainersReady}

  - name: the same condition type twice
    resource: widgets.example.com
    object:
      metadata: {name: w, namespace: x}
      status:
        conditions:
          - {type: Foo, status: "False", reason: A}
          - {type: Foo, status: "False", reason: B}
    expect:
      - {key: Foo, condition: Foo}
      - {key: Foo False B, condition: Foo}

  - name: a timestamp without zone is not RFC3339
    resource: pods
    now: 2026-01-01T00:00:10Z
    object:
      metadata: {name: p, namespace: default}
      status:
        conditions:
          - {type: ContainersReady, status: "False", lastTransitionTime: "2026-01-01T00:00:00"}
    expect:
      - {condition: ContainersReady, since: ""}

  - name: Suspended=False is healthy
    resource: sandboxes.agents.x-k8s.io
    object:
      metadata: {name: s, namespace: x}
      status:
        conditions:
          - {type: Suspended, status: "False", reason: NotSuspended, message: Sandbox is not suspended}
          - {type: Ready, status: "True"}
    expect: []

  - name: HPA at its minimum
    resource: horizontalpodautoscalers.autoscaling
    object:
      metadata: {name: h, namespace: default}
      status:
        conditions:
          - {type: AbleToScale, status: "True"}
          - {type: ScalingLimited, status: "True", reason: TooFewReplicas, message: the desired replica count is less than the minimum replica count}
    expect: []

  - name: taught polarity wins over the built-in tables
    resource: widgets.example.com
    params:
      rules:
        widgets.example.com:
          healthyWhenFalse: [Stalled, Synced]
          ignoreTypes: [LastSyncAttempted]
    object:
      metadata: {name: w1, namespace: team-a}
      status:
        conditions:
          - {type: Stalled, status: "False", reason: AllGood}
          - {type: Synced, status: "True", reason: Weird}
          - {type: LastSyncAttempted, status: "False", reason: Never}
    expect:
      - key: Synced
        condition: Synced
        message: 'Condition Synced=True Weird ""'
        details: {status: "True", reason: Weird, message: ""}

  - name: a taught condition is still reported with its bad status
    resource: widgets.example.com
    params:
      rules:
        widgets.example.com: {healthyWhenFalse: [Stalled]}
    object:
      metadata: {name: w1, namespace: team-a}
      status:
        conditions:
          - {type: Stalled, status: "True", reason: Stuck, message: no progress}
    expect:
      - key: Stalled
        condition: Stalled
        message: 'Condition Stalled=True Stuck "no progress"'
        details: {status: "True", reason: Stuck, message: no progress}

  - name: rules for any resource and for the core group
    resource: pods
    params:
      rules:
        "*": {ignoreTypes: [Flaky]}
        pods: {healthyWhenFalse: [Custom]}
    object:
      metadata: {name: p1, namespace: default}
      status:
        conditions:
          - {type: Flaky, status: "False"}
          - {type: Custom, status: "False"}
          - {type: Ready, status: "True"}
    expect: []

  - name: rules of another group do not apply
    resource: widgets.other.io
    params:
      rules:
        widgets.example.com: {ignoreTypes: [Broken]}
    object:
      metadata: {name: w1, namespace: team-a}
      status:
        conditions:
          - {type: Broken, status: "True", reason: X}
    expect:
      - key: Broken
        condition: Broken
        message: 'Condition Broken=True X ""'
        details: {status: "True", reason: X, message: ""}

  - name: taught types are reported with status Unknown, the rule of the resource wins over "*"
    resource: widgets.example.com
    params:
      rules:
        "*": {healthyWhenTrue: [Stalled]}
        widgets.example.com: {healthyWhenFalse: [Stalled]}
    object:
      metadata: {name: w1, namespace: team-a}
      status:
        conditions:
          - {type: Stalled, status: "False"}
          - {type: Synced, status: Unknown, reason: Pending}
    expect:
      - key: Synced
        condition: Synced
        message: 'Condition Synced=Unknown Pending ""'
        details: {status: Unknown, reason: Pending, message: ""}

  - name: rules which are not lists are ignored
    resource: widgets.example.com
    params:
      rules:
        widgets.example.com: {ignoreTypes: ReadyX}
    object:
      metadata: {name: w1, namespace: team-a}
      status:
        conditions:
          - {type: Ready, status: "False", reason: X}
    expect:
      - key: Ready
        condition: Ready
        message: 'Condition Ready=False X ""'
        details: {status: "False", reason: X, message: ""}

  - name: PVC condition Unused is informational
    resource: persistentvolumeclaims
    object:
      metadata: {name: data, namespace: default}
      status:
        phase: Bound
        conditions:
          - {type: Unused, status: "False", reason: PodUsingPVC, message: A pod is currently referencing this PVC}
    expect: []

  - name: healthy Longhorn node
    resource: nodes.longhorn.io
    object:
      metadata: {name: n1, namespace: longhorn-system}
      status:
        conditions:
          - {type: KernelModulesLoaded, status: "True", reason: KernelModulesLoaded}
          - {type: Multipathd, status: "True"}
          - {type: MountPropagation, status: "True"}
          - {type: RequiredPackages, status: "True"}
          - {type: Schedulable, status: "True"}
          - {type: Ready, status: "True"}
    expect: []

  - name: Longhorn node with multipathd running
    resource: nodes.longhorn.io
    object:
      metadata: {name: n1, namespace: longhorn-system}
      status:
        conditions:
          - {type: Multipathd, status: "False", reason: MultipathdIsRunning, message: multipathd is running with a known issue}
          - {type: Schedulable, status: "True"}
    expect:
      - key: Multipathd
        condition: Multipathd
        message: 'Condition Multipathd=False MultipathdIsRunning "multipathd is running with a known issue"'
        details: {status: "False", reason: MultipathdIsRunning, message: multipathd is running with a known issue}

  - name: healthy system-upgrade-controller plan
    resource: plans.upgrade.cattle.io
    object:
      metadata: {name: k3s-server, namespace: system-upgrade}
      status:
        conditions:
          - {type: LatestResolved, status: "True", reason: Version}
          - {type: Validated, status: "True"}
    expect: []

  - name: plan which does not validate
    resource: plans.upgrade.cattle.io
    object:
      metadata: {name: k3s-server, namespace: system-upgrade}
      status:
        conditions:
          - {type: LatestResolved, status: "False", reason: Error, message: "no release found"}
          - {type: Validated, status: "False", reason: Error, message: "spec.concurrency must be greater than 0"}
    expect:
      - {key: LatestResolved, condition: LatestResolved}
      - {key: Validated, condition: Validated}

  - name: finished Keycloak realm import
    resource: keycloakrealmimports.k8s.keycloak.org
    object:
      metadata: {name: realm, namespace: keycloak}
      status:
        conditions:
          - {type: Done, status: "True"}
          - {type: Started, status: "False"}
          - {type: HasErrors, status: "False"}
    expect: []

  - name: failed Keycloak realm import
    resource: keycloakrealmimports.k8s.keycloak.org
    object:
      metadata: {name: realm, namespace: keycloak}
      status:
        conditions:
          - {type: Done, status: "False", message: import job did not finish}
          - {type: Started, status: "True", message: import job is running}
          - {type: HasErrors, status: "True", message: "import job failed: 1 error"}
    expect:
      - {key: Done, condition: Done}
      - {key: Started, condition: Started}
      - key: HasErrors
        condition: HasErrors
        message: 'Condition HasErrors=True  "import job failed: 1 error"'
        details: {status: "True", reason: "", message: "import job failed: 1 error"}

  - name: healthy Keycloak
    resource: keycloaks.k8s.keycloak.org
    object:
      metadata: {name: kc, namespace: keycloak}
      status:
        conditions:
          - {type: Ready, status: "True"}
          - {type: HasErrors, status: "False"}
          - {type: RollingUpdate, status: "False"}
    expect: []

  - name: Keycloak during a rolling update
    resource: keycloaks.k8s.keycloak.org
    object:
      metadata: {name: kc, namespace: keycloak}
      status:
        conditions:
          - {type: Ready, status: "True"}
          - {type: HasErrors, status: "False"}
          - {type: RollingUpdate, status: "True", message: Rolling out deployment update}
    expect:
      - key: RollingUpdate
        condition: RollingUpdate
        message: 'Condition RollingUpdate=True  "Rolling out deployment update"'
        details: {status: "True", reason: "", message: Rolling out deployment update}

  - name: healthy ExternalSecret
    resource: externalsecrets.external-secrets.io
    object:
      metadata: {name: creds, namespace: default}
      status:
        conditions:
          - {type: Ready, status: "True", reason: SecretSynced, message: secret synced}
    expect: []
