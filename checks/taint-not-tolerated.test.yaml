check: taint-not-tolerated
cases:
  - name: one taint tolerated, one not, system taints skipped
    resource: nodes
    object:
      metadata: {name: n1}
      spec:
        taints:
          - {key: dedicated, value: gpu, effect: NoSchedule}
          - {key: maintenance, effect: NoExecute}
          - {key: soft, effect: PreferNoSchedule}
          - {key: node.kubernetes.io/unschedulable, effect: NoSchedule}
          - {key: node-role.kubernetes.io/control-plane, effect: NoSchedule}
    related:
      - resource: pods
        object:
          metadata: {name: train, namespace: ml}
          spec: {tolerations: [{key: dedicated, operator: Equal, value: gpu, effect: NoSchedule}]}
      - resource: pods
        object:
          metadata: {name: cni, namespace: kube-system}
          spec: {tolerations: [{operator: Exists}]}
      - resource: pods
        object:
          metadata: {name: wrong-value, namespace: x}
          spec: {tolerations: [{key: maintenance, operator: Equal, value: "yes", effect: NoExecute}]}
    expect:
      - {key: "maintenance:NoExecute", message: "taint maintenance:NoExecute is tolerated by no Pod: only Pods which tolerate everything run there"}
  - name: tolerated with Exists and without effect
    resource: nodes
    object:
      metadata: {name: n1}
      spec: {taints: [{key: dedicated, value: db, effect: NoSchedule}]}
    related:
      - resource: pods
        object:
          metadata: {name: db, namespace: x}
          spec: {tolerations: [{key: dedicated, operator: Exists}]}
    expect: []
  - name: a toleration of another effect does not count
    resource: nodes
    available: [pods]
    object:
      metadata: {name: n1}
      spec: {taints: [{key: dedicated, value: db, effect: NoExecute}]}
    related:
      - resource: pods
        object:
          metadata: {name: db, namespace: x}
          spec: {tolerations: [{key: dedicated, operator: Exists, effect: NoSchedule}]}
    expect:
      - {key: "dedicated=db:NoExecute"}
