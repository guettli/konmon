check: pvc-almost-full
cases:
  - name: 95% full
    resource: persistentvolumeclaims
    object:
      metadata: {name: data, namespace: default}
      spec: {accessModes: [ReadWriteOnce]}
    related:
      - resource: pods
        object:
          metadata: {name: db-0, namespace: default}
          spec:
            volumes: [{name: data, persistentVolumeClaim: {claimName: data}}]
            containers: [{name: db, volumeMounts: [{name: data, mountPath: /data}]}]
    volumeStats:
      - {node: n1, pod: db-0, usedBytes: 10200547328, availableBytes: 536870912, capacityBytes: 10737418240}
    expect:
      - {key: bytes, message: "volume is 95% full (9.5 GiB used of 10.0 GiB, 512.0 MiB free)", details: {node: n1, pod: db-0, usedBytes: "10200547328", availableBytes: "536870912", capacityBytes: "10737418240"}}
  - name: below the threshold
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {usedBytes: 8589934592, availableBytes: 2147483648, capacityBytes: 10737418240, inodes: 100, inodesUsed: 50, inodesFree: 50}
    expect: []
  - name: exactly at the threshold
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {usedBytes: 90, availableBytes: 10, capacityBytes: 100}
    expect:
      - {key: bytes, message: "volume is 90% full (90 B used of 100 B, 10 B free)"}
  - name: reserved blocks count as used, like df
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      # 85% of the capacity is used, but 10% are reserved for root.
      - {usedBytes: 85, availableBytes: 5, capacityBytes: 100}
    expect:
      - {key: bytes, message: "volume is 94% full (85 B used of 100 B, 5 B free)"}
  - name: no available bytes reported
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {usedBytes: 95, capacityBytes: 100}
    expect:
      - {key: bytes, message: "volume is 95% full (95 B used of 100 B)"}
  - name: inodes used up
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {usedBytes: 10, availableBytes: 90, capacityBytes: 100, inodes: 1000, inodesUsed: 990, inodesFree: 10}
    expect:
      - {key: inodes, message: "volume has used 99% of its inodes (990 used of 1000, 10 free)"}
  - name: inodes without a total
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {inodesUsed: 95, inodesFree: 5}
    expect:
      - {key: inodes, message: "volume has used 95% of its inodes (95 used, 5 free)", details: {node: "", pod: "", inodesUsed: "95", inodesFree: "5"}}
  - name: threshold as parameter
    resource: persistentvolumeclaims
    available: [pods]
    params: {percent: 80}
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {usedBytes: 85, availableBytes: 15, capacityBytes: 100}
    expect:
      - {key: bytes}
  - name: not mounted
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats: []
    expect: []
  - name: not collected yet
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    expectError: not collected yet
  - name: no stats while a kubelet fails
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats: []
    volumeStatsIncomplete: true
    expectError: some node could not be asked
  - name: stale stats
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
    volumeStats:
      - {node: n1, usedBytes: 99, availableBytes: 1, stale: true}
    expectError: out of date
  - name: ReadOnlyMany only (a read-only image)
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: image, namespace: default}
      spec: {accessModes: [ReadOnlyMany]}
    volumeStats:
      - {usedBytes: 100, availableBytes: 0, capacityBytes: 100}
    expect: []
  - name: mounted read-only in the volume
    resource: persistentvolumeclaims
    object:
      metadata: {name: image, namespace: default}
      spec: {accessModes: [ReadWriteOnce]}
    related:
      - resource: pods
        object:
          metadata: {name: app, namespace: default}
          spec:
            volumes: [{name: img, persistentVolumeClaim: {claimName: image, readOnly: true}}]
            containers: [{name: app, volumeMounts: [{name: img, mountPath: /img}]}]
    volumeStats:
      - {usedBytes: 100, availableBytes: 0, capacityBytes: 100}
    expect: []
  - name: mounted read-only by every container
    resource: persistentvolumeclaims
    object:
      metadata: {name: image, namespace: default}
    related:
      - resource: pods
        object:
          metadata: {name: app, namespace: default}
          spec:
            volumes: [{name: img, persistentVolumeClaim: {claimName: image}}]
            initContainers: [{name: init, volumeMounts: [{name: img, mountPath: /img, readOnly: true}]}]
            containers: [{name: app, volumeMounts: [{name: img, mountPath: /img, readOnly: true}]}]
    volumeStats:
      - {usedBytes: 100, availableBytes: 0, capacityBytes: 100}
    expect: []
  - name: one container mounts it writable
    resource: persistentvolumeclaims
    object:
      metadata: {name: data, namespace: default}
    related:
      - resource: pods
        object:
          metadata: {name: app, namespace: default}
          spec:
            volumes: [{name: d, persistentVolumeClaim: {claimName: data}}]
            containers:
              - {name: reader, volumeMounts: [{name: d, mountPath: /d, readOnly: true}]}
              - {name: writer, volumeMounts: [{name: d, mountPath: /d}]}
    volumeStats:
      - {usedBytes: 100, availableBytes: 0, capacityBytes: 100}
    expect:
      - {key: bytes, message: "volume is 100% full (100 B used of 100 B, 0 B free)"}
  - name: one Pod read-only, another writable
    resource: persistentvolumeclaims
    object:
      metadata: {name: data, namespace: default}
    related:
      - resource: pods
        object:
          metadata: {name: reader, namespace: default}
          spec:
            volumes: [{name: d, persistentVolumeClaim: {claimName: data, readOnly: true}}]
            containers: [{name: c, volumeMounts: [{name: d, mountPath: /d}]}]
      - resource: pods
        object:
          metadata: {name: writer, namespace: default}
          spec:
            volumes: [{name: d, persistentVolumeClaim: {claimName: data}}]
            containers: [{name: c, volumeMounts: [{name: d, mountPath: /d}]}]
    volumeStats:
      - {usedBytes: 100, availableBytes: 0, capacityBytes: 100}
    expect:
      - {key: bytes}
  - name: a finished Pod does not make it writable
    resource: persistentvolumeclaims
    object:
      metadata: {name: image, namespace: default}
    related:
      - resource: pods
        object:
          metadata: {name: ro, namespace: default}
          spec:
            volumes: [{name: d, persistentVolumeClaim: {claimName: image, readOnly: true}}]
            containers: [{name: c, volumeMounts: [{name: d, mountPath: /d}]}]
      - resource: pods
        object:
          metadata: {name: fill, namespace: default}
          spec:
            volumes: [{name: d, persistentVolumeClaim: {claimName: image}}]
            containers: [{name: c, volumeMounts: [{name: d, mountPath: /d}]}]
          status: {phase: Succeeded}
    volumeStats:
      - {usedBytes: 100, availableBytes: 0, capacityBytes: 100}
    expect: []
  - name: generic ephemeral volume
    resource: persistentvolumeclaims
    object:
      metadata: {name: app-scratch, namespace: default}
    related:
      - resource: pods
        object:
          metadata: {name: app, namespace: default}
          spec:
            volumes: [{name: scratch, ephemeral: {volumeClaimTemplate: {spec: {}}}}]
            containers: [{name: c, volumeMounts: [{name: scratch, mountPath: /s}]}]
    volumeStats:
      - {usedBytes: 99, availableBytes: 1, capacityBytes: 100}
    expect:
      - {key: bytes}
  - name: local-path volume on the node's filesystem is skipped, bytes and inodes
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: pvc-123}
    related:
      - resource: persistentvolumes
        object:
          metadata: {name: pvc-123, annotations: {pv.kubernetes.io/provisioned-by: rancher.io/local-path}}
          spec: {capacity: {storage: 10Gi}, local: {path: /var/lib/rancher/k3s/storage/pvc-123_default_data}}
    volumeStats:
      - {usedBytes: 1900000000000, availableBytes: 100000000000, capacityBytes: 2000000000000, inodes: 100, inodesUsed: 99, inodesFree: 1}
    expect: []
  - name: OpenEBS hostpath, a large claim on the node's filesystem
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: pvc-9}
    related:
      - resource: persistentvolumes
        object:
          metadata: {name: pvc-9, annotations: {pv.kubernetes.io/provisioned-by: openebs.io/local}}
          spec: {capacity: {storage: 1Ti}, local: {path: /var/openebs/local/pvc-9}}
    volumeStats:
      - {usedBytes: 1900000000000, availableBytes: 100000000000, capacityBytes: 2000000000000}
    expect: []
  - name: shared filesystems can be checked anyway
    resource: persistentvolumeclaims
    available: [pods]
    params: {sharedFilesystems: true}
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: pvc-123}
    related:
      - resource: persistentvolumes
        object:
          metadata: {name: pvc-123, annotations: {pv.kubernetes.io/provisioned-by: rancher.io/local-path}}
          spec: {capacity: {storage: 10Gi}, local: {path: /x}}
    volumeStats:
      - {usedBytes: 1900000000000, availableBytes: 100000000000, capacityBytes: 2000000000000}
    expect:
      - {key: bytes}
  - name: a hand-written local PV on a disk of its own is checked, even with a placeholder capacity
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: pv-disk}
    related:
      - resource: persistentvolumes
        object:
          metadata: {name: pv-disk}
          spec: {capacity: {storage: 5Gi}, local: {path: /mnt/disks/nvme0}}
    volumeStats:
      - {usedBytes: 950000000000, availableBytes: 50000000000, capacityBytes: 1000000000000}
    expect:
      - {key: bytes}
  - name: a CSI volume is checked
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: pv-csi}
    related:
      - resource: persistentvolumes
        object:
          metadata: {name: pv-csi, annotations: {pv.kubernetes.io/provisioned-by: rancher.io/local-path}}
          spec: {capacity: {storage: 1Gi}, csi: {driver: x, volumeHandle: y}}
    volumeStats:
      - {usedBytes: 9500000000, availableBytes: 500000000, capacityBytes: 10000000000}
    expect:
      - {key: bytes}
  - name: the PV does not exist, or the claim has no volume name
    resource: persistentvolumeclaims
    available: [pods, persistentvolumes]
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: gone}
    volumeStats:
      - {usedBytes: 9500000000, availableBytes: 500000000, capacityBytes: 10000000000}
    expect:
      - {key: bytes}
  - name: without access to PVs nothing is skipped
    resource: persistentvolumeclaims
    available: [pods]
    object:
      metadata: {name: data, namespace: default}
      spec: {volumeName: pvc-123}
    volumeStats:
      - {usedBytes: 9500000000, availableBytes: 500000000, capacityBytes: 10000000000}
    expect:
      - {key: bytes}
