check: selector-matches-no-pods
cases:
  - name: pdb without pods
    resource: poddisruptionbudgets.policy
    object:
      kind: PodDisruptionBudget
      metadata: {name: b, namespace: default}
      spec: {selector: {matchLabels: {app: gone}}}
    related:
      - {resource: pods, object: {metadata: {name: p, namespace: default, labels: {app: web}}}}
    expect:
      - {message: PodDisruptionBudget selects no Pods}
  - name: network policy with matching pod, and default-deny
    resource: networkpolicies.networking.k8s.io
    object:
      kind: NetworkPolicy
      metadata: {name: n, namespace: default}
      spec: {podSelector: {matchExpressions: [{key: app, operator: Exists}]}}
    related:
      - {resource: pods, object: {metadata: {name: p, namespace: default, labels: {app: web}}}}
    expect: []
  - name: default deny
    resource: networkpolicies.networking.k8s.io
    available: [pods]
    object:
      metadata: {name: deny, namespace: default}
      spec: {podSelector: {}}
    expect: []
  - name: namespace selectors which match no namespace
    resource: networkpolicies.networking.k8s.io
    object:
      kind: NetworkPolicy
      metadata: {name: n, namespace: default}
      spec:
        podSelector: {}
        ingress:
          - from:
              - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitorng}}
              - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
              - namespaceSelector: {}
              - podSelector: {matchLabels: {app: gone}}
          - from:
              - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitorng}}
                podSelector: {matchLabels: {app: prometheus}}
        egress:
          - to:
              - namespaceSelector: {matchExpressions: [{key: team, operator: In, values: [a, b]}, {key: gone, operator: Exists}]}
              - namespaceSelector: {matchExpressions: [{key: team, operator: NotIn, values: [x]}]}
          - to: [{ipBlock: {cidr: 10.0.0.0/8}}]
    related:
      - {resource: namespaces, object: {metadata: {name: monitoring, labels: {kubernetes.io/metadata.name: monitoring}}}}
      - {resource: namespaces, object: {metadata: {name: a, labels: {team: a}}}}
      - {resource: pods, object: {metadata: {name: p, namespace: default}}}
    expect:
      - {key: ingress namespaces kubernetes.io/metadata.name=monitorng, message: ingress namespaceSelector kubernetes.io/metadata.name=monitorng selects no Namespaces}
      - {key: "egress namespaces team in (a,b),gone", message: "egress namespaceSelector team in (a,b),gone selects no Namespaces"}
  - name: namespaces cannot be listed
    resource: networkpolicies.networking.k8s.io
    available: [pods]
    object:
      metadata: {name: n, namespace: default}
      spec:
        podSelector: {}
        ingress: [{from: [{namespaceSelector: {matchLabels: {x: y}}}]}]
    expect: []
