check: serviceaccount-missing
cases:
  - name: missing
    resource: deployments.apps
    available: [serviceaccounts]
    object:
      metadata: {name: web, namespace: default}
      spec: {template: {spec: {serviceAccountName: web}}}
    expect:
      - {message: Pods use the ServiceAccount web which does not exist}
  - name: cronjob with existing account
    resource: cronjobs.batch
    object:
      metadata: {name: c, namespace: default}
      spec: {jobTemplate: {spec: {template: {spec: {serviceAccountName: backup}}}}}
    related:
      - {resource: serviceaccounts, object: {metadata: {name: backup, namespace: default}}}
    expect: []
  - name: scaled to zero or finished
    resource: deployments.apps
    available: [serviceaccounts]
    object:
      metadata: {name: web, namespace: default}
      spec: {replicas: 0, template: {spec: {serviceAccountName: gone}}}
    expect: []
  - name: completed job
    resource: jobs.batch
    available: [serviceaccounts]
    object:
      metadata: {name: j, namespace: default}
      spec: {template: {spec: {serviceAccountName: gone}}}
      status: {conditions: [{type: Complete, status: "True"}]}
    expect: []
