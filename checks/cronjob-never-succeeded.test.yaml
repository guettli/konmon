check: cronjob-never-succeeded
cases:
  - name: only failed jobs
    resource: cronjobs.batch
    object:
      metadata: {name: backup, namespace: default, uid: cj1}
      status: {lastScheduleTime: "2026-01-01T00:00:00Z"}
    related:
      - resource: jobs.batch
        object:
          metadata: {name: backup-1, namespace: default, ownerReferences: [{uid: cj1, kind: CronJob, name: backup, apiVersion: batch/v1}]}
          status: {conditions: [{type: Failed, status: "True"}]}
    expect:
      - {message: CronJob has never succeeded (1 failed Jobs), since: "2026-01-01T00:00:00Z"}
  - name: never scheduled or succeeded
    resource: cronjobs.batch
    available: [jobs.batch]
    object:
      metadata: {name: backup, namespace: default}
      status: {lastScheduleTime: "2026-01-01T00:00:00Z", lastSuccessfulTime: "2026-01-01T00:01:00Z"}
    expect: []
  - name: first job still running
    resource: cronjobs.batch
    available: [jobs.batch]
    object:
      metadata: {name: backup, namespace: default}
      status: {lastScheduleTime: "2026-01-01T00:00:00Z", active: [{name: backup-1}]}
    expect: []
