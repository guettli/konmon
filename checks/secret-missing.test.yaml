check: secret-missing
cases:
  - name: missing secrets, optional ones and existing ones are fine
    resource: pods
    object:
      metadata: {name: p, namespace: default}
      spec:
        imagePullSecrets: [{name: regcred}, {name: pull}]
        initContainers:
          - name: init
            envFrom: [{secretRef: {name: gone-init}}, {secretRef: {name: opt, optional: true}}]
        containers:
          - name: app
            env:
              - {name: A, valueFrom: {secretKeyRef: {name: db, key: password}}}
              - {name: B, valueFrom: {secretKeyRef: {name: gone-env, key: x}}}
              - {name: C, valueFrom: {secretKeyRef: {name: gone-opt, key: x, optional: true}}}
        volumes:
          - {name: tls, secret: {secretName: gone-tls}}
          - {name: o, secret: {secretName: other, optional: true}}
          - name: proj
            projected: {sources: [{secret: {name: gone-proj}}, {serviceAccountToken: {path: t}}]}
    related:
      - {resource: secrets, object: {metadata: {name: db, namespace: default}}}
      - {resource: secrets, object: {metadata: {name: pull, namespace: default}}}
      - {resource: secrets, object: {metadata: {name: regcred, namespace: other}}}
    expect:
      - {key: gone-init, message: Secret gone-init does not exist}
      - {key: gone-env, message: Secret gone-env does not exist}
      - {key: gone-tls, message: Secret gone-tls does not exist}
      - {key: gone-proj, message: Secret gone-proj does not exist}
      - {key: regcred, message: image pull Secret regcred does not exist, severity: info}
  - name: a secret referenced twice is reported once
    resource: pods
    available: [secrets]
    object:
      metadata: {name: p, namespace: default}
      spec:
        imagePullSecrets: [{name: gone}]
        containers: [{name: app, envFrom: [{secretRef: {name: gone}}]}]
        volumes: [{name: v, secret: {secretName: gone}}]
    expect:
      - {key: gone, message: Secret gone does not exist, severity: warning}
  - name: finished pod
    resource: pods
    available: [secrets]
    object:
      metadata: {name: p, namespace: default}
      spec: {containers: [{name: app, envFrom: [{secretRef: {name: pruned}}]}]}
      status: {phase: Succeeded}
    expect: []
  - name: secrets cannot be listed
    resource: pods
    object:
      metadata: {name: p, namespace: default}
      spec: {containers: [{name: app, envFrom: [{secretRef: {name: gone}}]}]}
    expect: []
  - name: csi and ephemeral containers
    resource: pods
    available: [secrets]
    object:
      metadata: {name: p, namespace: default}
      spec:
        containers: [{name: app}]
        ephemeralContainers: [{name: debug, env: [{name: X, valueFrom: {secretKeyRef: {name: gone-debug, key: x}}}]}]
        volumes:
          - {name: smb, csi: {driver: smb.csi.k8s.io, nodePublishSecretRef: {name: gone-smb}}}
          - {name: plain, csi: {driver: secrets-store.csi.k8s.io}}
    expect:
      - {key: gone-debug, message: Secret gone-debug does not exist}
      - {key: gone-smb, message: Secret gone-smb does not exist}
  - name: terminating and failed pods
    resource: pods
    available: [secrets]
    object:
      metadata: {name: p, namespace: default, deletionTimestamp: "2026-01-01T00:00:00Z"}
      spec: {containers: [{name: app, envFrom: [{secretRef: {name: deleted}}]}]}
    expect: []
  - name: failed pod
    resource: pods
    available: [secrets]
    object:
      metadata: {name: p, namespace: default}
      spec: {containers: [{name: app, envFrom: [{secretRef: {name: pruned}}]}]}
      status: {phase: Failed}
    expect: []
