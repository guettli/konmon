check: container-resources-missing
cases:
  - name: one without resources
    resource: statefulsets.apps
    object:
      metadata: {name: db, namespace: default}
      spec:
        template:
          spec:
            containers:
              - {name: a, image: x, resources: {requests: {memory: 1Gi}}}
              - {name: b, image: x}
    expect:
      - {key: b, message: container b has no resource requests or limits}

  - name: pods of an operator's custom resource are reported
    resource: pods
    object:
      metadata: {name: p, namespace: default, ownerReferences: [{uid: x, kind: Cluster, name: pg, apiVersion: postgresql.cnpg.io/v1, controller: true}]}
      spec: {containers: [{name: a, image: "nginx:1.27"}]}
    expect:
      - {container: a}
  - name: a Job of a CronJob is reported via the CronJob
    resource: jobs.batch
    object:
      metadata: {name: j, namespace: default, ownerReferences: [{uid: x, kind: CronJob, name: c, apiVersion: batch/v1, controller: true}]}
      spec: {template: {spec: {containers: [{name: a, image: "nginx:1.27"}]}}}
    expect: []
  - name: a standalone Job is reported
    resource: jobs.batch
    object:
      metadata: {name: j, namespace: default}
      spec: {template: {spec: {containers: [{name: a, image: "nginx:1.27"}]}}}
    expect:
      - {container: a}
