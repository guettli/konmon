name: Bug
description: konmon does something wrong (other than a false positive).
title: "Bug: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: konmon version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      render: console
