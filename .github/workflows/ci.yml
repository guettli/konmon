name: CI

# Pull requests, and pushes to main (the release workflow runs after CI on
# main). Other branches get CI through their pull request.
#
# Each job has its own Go cache key: jobs which share one fight over it,
# and only one of them saves it.
on:
  pull_request:
  push:
    branches: [main]
  # Weekly, for new vulnerabilities (govulncheck) without a change here.
  # The release only runs after a push.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; runs on main finish
  # (the release depends on them).
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test core and example checks
        run: go run . checks test --checks examples

      - name: Build all release targets (make build-all)
        # The targets of the release workflow, so a platform-specific build
        # error shows up in the pull request.
        run: make build-all

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Type-check and formatting (make typescript)
        run: make typescript

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: golangci-lint, actionlint, govulncheck, go mod tidy, shellcheck, generated docs (make lint)
        # govulncheck fails on vulnerabilities which the code can reach,
        # also in the Go standard library: update the toolchain line in
        # go.mod.
        run: make lint

  image:
    # The release builds the image from the release binaries; build it here
    # too, so a broken Dockerfile shows up before the release.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # one small build

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/konmon-linux-amd64 .

      - name: Build image
        run: docker build --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 -t konmon:ci .

      - name: Smoke test
        run: |
          docker run --rm konmon:ci version
          docker run --rm konmon:ci checks list > /dev/null

  e2e:
    # deploy/ on a kind cluster with the image of this commit: konmon check
    # and the running konmon must report a broken Deployment.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/e2e.sh

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: konmon-e2e

      - name: End-to-end test (make e2e)
        run: make e2e
