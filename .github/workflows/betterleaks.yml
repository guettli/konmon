# Scan all files for secrets. The pre-commit hook only sees staged changes,
# so this also catches commits made with --no-verify or in the web UI.
name: betterleaks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs only betterleaks, at the version pinned in mise.toml.
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: betterleaks

      - name: Scan all files
        run: betterleaks dir . --redact --no-banner
